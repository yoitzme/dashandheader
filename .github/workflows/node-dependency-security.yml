name: Node dependency security
on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: '31 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
      - run: node --test scripts/security/check-node-runtime.test.cjs
      - run: node scripts/security/check-node-runtime.cjs
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: ["."]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
      - name: Audit locked dependencies without install scripts
        working-directory: ${{ matrix.directory }}
        run: npm audit --package-lock-only --ignore-scripts --audit-level=high
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        directory: ["."]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies without lifecycle scripts
        working-directory: ${{ matrix.directory }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build when the package defines a build
        working-directory: ${{ matrix.directory }}
        run: npm run build --if-present --ignore-scripts
